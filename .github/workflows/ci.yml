name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check pehredar tests

      - name: Run tests with pytest
        run: pytest tests/ -q

      - name: Stalkerware DB freshness (warning only)
        # Never blocks the build — a stale DB just means a curator should
        # review upstream IOCs and run scripts/update_stalkerware_db.py.
        run: |
          python scripts/update_stalkerware_db.py --check --max-age-days 90 || echo "::warning::Stalkerware indicator DB is stale — review upstream IOCs"

  gui-smoke:
    name: GUI boot smoke (Electron, headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install GUI dependencies
        working-directory: gui
        run: npm ci

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Boot smoke test
        # A broken boot hangs on an error dialog instead of exiting, so the
        # timeout wrapper turns hangs into failures. Both the exit code AND
        # the SMOKE-OK marker must pass. --no-sandbox comes before the app
        # path (Chromium consumes it): GitHub runners can't use Electron's
        # SUID sandbox, which needs a root-owned mode-4755 helper.
        working-directory: gui
        run: |
          set -o pipefail
          timeout 120 xvfb-run -a npx electron --no-sandbox . --smoke-test 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          grep -q "SMOKE-OK" "$RUNNER_TEMP/smoke.log"